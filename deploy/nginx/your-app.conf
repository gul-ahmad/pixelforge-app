# /etc/nginx/sites-available/your-app
# Follows the server admin's template. One addition: the webhook location (see below).
server {
    listen 8200;
    root /var/www/your-app/public;
    index index.php;
    client_max_body_size 20m;

    # Private preview: the whole site asks for a password…
    auth_basic "Private preview";
    auth_basic_user_file /etc/nginx/your-app.htpasswd;

    # …except Pixelforge's webhook. It's a machine-to-machine call that can't send a
    # password; the app authenticates it with the HMAC Pixelforge-Signature header instead.
    # It goes straight to PHP (no try_files): an internal redirect to /index.php would
    # land in the PHP location below, which inherits auth_basic and would answer 401.
    location = /webhooks/pixelforge {
        auth_basic off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/your-app.sock;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/your-app.sock;
    }

    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/your-app.access.log;
    error_log  /var/log/nginx/your-app.error.log;
}
