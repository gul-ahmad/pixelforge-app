; /etc/php/8.4/fpm/pool.d/your-app.conf
; Admin's template, placed in the PHP 8.4 folder (the app needs PHP 8.4; 8.2 stays the default).
[your-app]
user = your-app-user
group = your-app-user
listen = /run/php/your-app.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 5
php_admin_value[open_basedir] = /var/www/your-app:/tmp
